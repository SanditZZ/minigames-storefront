name: CI

# Mirrors the local ship gate (scripts/ship.sh steps 1–4) so a push that somehow
# bypassed it still gets caught here. Same order, same commands.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build both apps
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      # Playwright transpiles specs without typechecking them, so a broken
      # helper would only surface as a confusing runtime error mid-suite.
      - name: Typecheck e2e
        working-directory: e2e
        run: npx tsc --noEmit
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Warm the Go build cache so Playwright's webServer start-up window is
      # spent booting the server, not compiling it.
      - name: Prebuild API
        working-directory: backend
        run: go build ./...
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

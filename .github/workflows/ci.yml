name: CI

# The fast half of the local ship gate (scripts/ship.sh), so a push that somehow
# bypassed it still gets caught here. Same npm scripts, invoked by name.
#
# The Playwright E2E suite deliberately does NOT run here: it needs a browser
# download plus a full API + frontend stack, which costs minutes per push for a
# single-maintainer repo. It runs locally instead, as a required step of
# ./scripts/ship.sh before every push — see CLAUDE.md. If this repo ever takes
# outside contributions, add it back as a job gated on pull_request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build both apps
        working-directory: frontend
        run: npm run build

  # Typechecking the E2E specs is kept here even though the suite itself is not
  # run: it needs no browser and no stack, finishes in seconds, and catches a
  # broken helper before someone hits it mid-suite locally.
  e2e-typecheck:
    name: E2E typecheck (suite runs locally)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci --ignore-scripts # skip the Playwright browser download
      - name: Typecheck
        working-directory: e2e
        run: npx tsc --noEmit

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Minigames Storefront</title>
    <meta name="description" content="Manage prizes, thresholds and leaderboards." />
    <!-- An internal tool behind a shared secret has no business in a search
         index, and its URLs are now addressable enough to be crawlable. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Icons. Generated by scripts/icons/ — the admin set inverts the player's
         palette (ink field, apricot mark) so the two are never confused on a
         home screen or in a tab strip. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFF0BE" />
    <meta name="application-name" content="Store Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Store Admin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
